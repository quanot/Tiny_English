<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Talk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDF2FF; --ink:#2B2350; --chip:#FFFFFF; --card-ink:#2B2350; --shadow:#2B2350;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1C1844; --ink:#FFF4D6; --chip:#2F2A66; --shadow:#0E0B2B; }
}
:root[data-theme="dark"]{ --bg:#1C1844; --ink:#FFF4D6; --chip:#2F2A66; --shadow:#0E0B2B; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  background:var(--bg); color:var(--ink);
  font-family:"Fredoka","Baloo 2","Arial Rounded MT Bold","Comic Sans MS",system-ui,sans-serif;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
  -webkit-tap-highlight-color:transparent; overflow:hidden;
}
button{ font-family:inherit; color:var(--card-ink); cursor:pointer; touch-action:manipulation; }
button:focus-visible{ outline:4px solid #8E6BE8; outline-offset:3px; }
.stk{ box-shadow:0 6px 0 var(--shadow); transition:transform .08s, box-shadow .08s; }
.stk:active{ transform:translateY(5px); box-shadow:0 1px 0 var(--shadow); }

/* floating background */
.bg{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.bg span{ position:absolute; top:0; opacity:.4; animation:drift linear infinite; }
@keyframes drift{ from{ transform:translateY(108vh) rotate(0deg); } to{ transform:translateY(-18vh) rotate(50deg); } }

#app{ position:relative; z-index:1; height:100%; max-width:960px; margin:0 auto; padding:12px 14px 14px; display:flex; flex-direction:column; }

/* header */
.top{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex:none; }
.title{ flex:1; min-width:0; font-weight:700; font-size:clamp(24px,5.5vw,36px); display:flex; align-items:center; gap:8px; }
.title span{ font-size:1.2em; }
.chips{ display:flex; gap:8px; align-items:center; }
.chip{ background:var(--chip); color:var(--ink); border:3px solid var(--ink); border-radius:999px; padding:4px 14px; font-weight:700; font-size:22px; }
.round{ width:60px; height:60px; border-radius:50%; border:4px solid var(--card-ink); background:#fff; font-size:28px; flex:none; padding:0; }
.round.sm{ width:48px; height:48px; font-size:22px; border-width:3px; }
.viBtn{ font-size:17px !important; font-weight:700; opacity:.5; }
.viBtn.on{ background:#FFD04D; opacity:1; }
.toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); translate:-50% 0; background:#2B2350; color:#fff; border-radius:20px; padding:10px 18px; font-size:18px; z-index:90; max-width:90%; text-align:center; animation:pop .25s; }

/* home */
.home{ flex:1; overflow-y:auto; padding:4px 4px 24px; }
.hero{ display:flex; align-items:center; justify-content:center; gap:14px; background:none; border:none; margin:0 auto 18px; padding:0; }
.duck{ font-size:clamp(72px,18vw,120px); line-height:1; display:inline-block; animation:bob 2.6s ease-in-out infinite; }
.bubble{ background:#fff; color:var(--card-ink); border:4px solid var(--card-ink); border-radius:28px 28px 28px 6px; padding:6px 24px; font-size:clamp(30px,7vw,46px); font-weight:700; box-shadow:0 6px 0 var(--shadow); }
@keyframes bob{ 50%{ transform:translateY(-10px) rotate(-4deg); } }
.grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
@media (min-width:700px){ .grid{ grid-template-columns:repeat(3,1fr); } }
.tile{ background:var(--c); border:5px solid var(--card-ink); border-radius:32px; padding:14px 8px 12px; display:flex; flex-direction:column; align-items:center; gap:2px; min-height:140px; font-size:clamp(24px,5.5vw,32px); font-weight:700; }
.tile .emo{ font-size:clamp(56px,13vw,84px); line-height:1.1; animation:tilebob 3s ease-in-out infinite; animation-delay:calc(var(--i) * .3s); }
@keyframes tilebob{ 50%{ transform:translateY(-6px) rotate(3deg); } }
.tile.wide{ grid-column:1/-1; flex-direction:row; justify-content:center; gap:18px; min-height:100px; }
.tile.wide .emo{ font-size:clamp(48px,10vw,70px); }

/* learn */
.learn{ flex:1; display:flex; align-items:stretch; gap:10px; min-height:0; }
.arrow{ width:clamp(48px,11vw,72px); align-self:center; height:clamp(80px,18vw,120px); border-radius:24px; background:#fff; border:4px solid var(--card-ink); font-size:26px; flex:none; padding:0; }
.card{
  position:relative; flex:1; min-width:0; border:5px solid var(--card-ink); border-radius:40px;
  background-color:var(--c);
  background-image:radial-gradient(rgba(255,255,255,.35) 3px, transparent 4px);
  background-size:34px 34px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:12px;
  animation:pop .35s cubic-bezier(.3,1.6,.5,1); overflow:hidden; box-shadow:0 8px 0 var(--shadow);
}
@keyframes pop{ from{ transform:scale(.82); opacity:0; } }
.bounce{ animation:bounce .5s; }
@keyframes bounce{ 30%{ transform:scale(1.07) rotate(-2deg); } 60%{ transform:scale(.97) rotate(2deg); } }
.art{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; animation:idle 3.4s ease-in-out infinite; }
@keyframes idle{ 50%{ transform:translateY(-8px); } }
.act-jump{ animation:jump .7s ease-in-out 2; }
@keyframes jump{ 0%,100%{ transform:translateY(0) scale(1,1); } 20%{ transform:scale(1.12,.88); } 50%{ transform:translateY(-44px) scale(.95,1.08); } 80%{ transform:scale(1.1,.9); } }
.act-drive{ animation:drive 1.5s ease-out; }
@keyframes drive{ 0%{ transform:translateX(-150%); } 55%{ transform:translateX(10%) rotate(-3deg); } 75%{ transform:translateX(-4%) rotate(2deg); } 100%{ transform:translateX(0); } }
.act-spin{ animation:spin .9s ease-in-out; }
@keyframes spin{ 50%{ transform:rotate(180deg) scale(1.2); } to{ transform:rotate(360deg) scale(1); } }
.act-wiggle{ animation:wiggle .5s 2; }
@keyframes wiggle{ 25%{ transform:rotate(-10deg) scale(1.05); } 75%{ transform:rotate(10deg) scale(1.05); } }
.act-pulse{ animation:pulse .55s 2; }
@keyframes pulse{ 50%{ transform:scale(1.2); } }
.act-boing{ animation:boing .8s; }
@keyframes boing{ 20%{ transform:scale(1.3,.7); } 45%{ transform:scale(.8,1.25) translateY(-30px); } 70%{ transform:scale(1.15,.9); } }
.ring{ position:absolute; left:50%; top:44%; translate:-50% -50%; width:46%; aspect-ratio:1; border-radius:50%; border:6px solid rgba(255,255,255,.85); opacity:0; pointer-events:none; }
.card.talk .ring{ animation:ping 1.2s ease-out infinite; }
.card.talk .ring.r2{ animation-delay:.4s; }
@keyframes ping{ 0%{ scale:.6; opacity:.9; } 100%{ scale:2.1; opacity:0; } }
.pt{ position:fixed; font-size:28px; pointer-events:none; z-index:60; animation:pt 1.1s ease-out forwards; }
@keyframes pt{ 0%{ transform:translate(-50%,-50%) scale(.4); opacity:1; } 100%{ transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(var(--r)); opacity:0; } }
.emo{ font-size:clamp(90px,26vmin,190px); line-height:1; display:inline-block; }
.emo.sm{ font-size:clamp(46px,12vmin,90px); }
.word{ position:relative; z-index:1; background:#fff; color:var(--card-ink); border:4px solid var(--card-ink); border-radius:32px; padding:0 26px; font-size:clamp(32px,8.5vw,54px); font-weight:700; text-align:center; line-height:1.2; }
.viPill{ position:relative; z-index:1; background:#FFF3B0; color:var(--card-ink); border:3px solid var(--card-ink); border-radius:24px; padding:0 20px; font-size:clamp(22px,5.5vw,32px); font-weight:600; text-align:center; }
.no-vi .viPill, .no-vi .cap i, .no-vi .ovVi{ display:none; }
.sound{ position:relative; z-index:1; font-size:clamp(20px,5vw,28px); font-weight:600; color:var(--card-ink); min-height:1.3em; text-align:center; }
.blob{ aspect-ratio:1; width:clamp(120px,32vmin,250px); border-radius:50%; border:6px solid var(--card-ink); }
.num,.letter{ font-weight:700; line-height:1; color:var(--card-ink); }
.num{ font-size:clamp(84px,24vmin,190px); }
.letter{ font-size:clamp(80px,22vmin,170px); }
.stars{ display:flex; flex-wrap:wrap; justify-content:center; gap:4px; font-size:clamp(24px,6vmin,42px); max-width:90%; }
.stars span{ display:inline-block; opacity:.4; filter:grayscale(1); }
.stars span.pop{ opacity:1; filter:none; animation:bounce .45s; }
.shape{ width:clamp(120px,30vmin,230px); height:auto; }
.dots{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:12px 0 0; flex:none; }
.dots i{ width:10px; height:10px; border-radius:50%; background:var(--ink); opacity:.25; }
.dots i.on{ opacity:1; transform:scale(1.4); }
.foot{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; padding-top:12px; flex:none; }
.big{ font-size:clamp(19px,4.8vw,28px); font-weight:700; padding:10px 18px; border-radius:999px; border:5px solid var(--card-ink); background:#FFD04D; flex:1 1 140px; max-width:260px; }
.big.alt{ background:#FF8FC7; }
.big.mint{ background:#7ED69A; }
.big.sky{ background:#7FD0FF; }

/* quiz */
.quiz{ flex:1; display:flex; flex-direction:column; gap:16px; min-height:0; }
.progress{ display:flex; gap:8px; justify-content:center; flex:none; }
.progress i{ font-style:normal; font-size:30px; filter:grayscale(1); opacity:.35; }
.progress i.on{ filter:none; opacity:1; animation:bounce .5s; }
.prompt{ align-self:center; display:flex; align-items:center; gap:12px; background:#fff; color:var(--card-ink); border:5px solid var(--card-ink); border-radius:999px; padding:8px 26px 8px 16px; font-size:clamp(20px,5vw,34px); font-weight:700; text-align:left; }
.prompt .spk{ font-size:1.4em; }
.choices{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; align-content:center; }
.choice{ background:#fff; border:5px solid var(--card-ink); border-radius:28px; aspect-ratio:1/1.15; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:6px; min-width:0; overflow:hidden; }
.choice .emo{ font-size:clamp(46px,14vw,110px); }
.choice .num{ font-size:clamp(56px,16vw,130px); }
.choice .letter{ font-size:clamp(46px,14vw,110px); }
.choice .shape{ width:78%; }
.choice .blob{ width:78%; border-width:5px; }
.choice.good{ background:#BDF5C8; animation:bounce .6s; }
.choice.good .emo,.choice.good .num,.choice.good .letter{ font-size:clamp(34px,10vw,70px); }
.choice.good .shape,.choice.good .blob{ width:52%; }
.choice.bad{ background:#FFE0E0; animation:wobble .4s; }
.choice.dim{ opacity:.4; }
.cap{ font-size:clamp(14px,3.8vw,20px); text-align:center; line-height:1.1; color:var(--card-ink); }
.cap b{ display:block; }
.cap i{ display:block; font-style:normal; opacity:.8; }
@keyframes wobble{ 20%{ transform:translateX(-10px); } 40%{ transform:translateX(10px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(6px); } }

/* picture question */
.picQ{ font-size:clamp(48px,12vw,84px); line-height:1; }

/* done */
.done{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
.trophy{ font-size:clamp(110px,30vmin,200px); line-height:1; animation:bob 1.6s ease-in-out infinite; }
.done h2{ font-size:clamp(38px,9vw,60px); margin:0; }
.won{ font-size:clamp(34px,8vw,56px); }

/* ABC song */
.sing{ flex:1; display:flex; flex-direction:column; gap:8px; min-height:0; }
.now{ text-align:center; font-size:clamp(64px,16vmin,110px); line-height:1.1; height:1.2em; flex:none; }
.nowTxt{ text-align:center; font-size:clamp(22px,5vw,32px); font-weight:700; min-height:1.3em; flex:none; }
.abc{ flex:1; display:grid; grid-template-columns:repeat(5,1fr); gap:10px; align-content:center; }
@media (min-width:700px){ .abc{ grid-template-columns:repeat(7,1fr); } }
.abc button{ background:#fff; border:4px solid var(--card-ink); border-radius:20px; font-size:clamp(26px,6.5vw,46px); font-weight:700; aspect-ratio:1; padding:0; transition:transform .15s, background .15s; }
.abc button.done{ background:#FFE9A0; }
.abc button.on{ background:#FFD04D; transform:scale(1.2); position:relative; z-index:1; }

/* say-it overlay */
.overlay{ position:fixed; inset:0; z-index:70; background:rgba(20,16,50,.72); display:flex; align-items:center; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); backdrop-filter:blur(4px); }
.sheet{ position:relative; width:min(560px,100%); max-height:100%; overflow:auto; background-color:var(--c); background-image:radial-gradient(rgba(255,255,255,.35) 3px, transparent 4px); background-size:34px 34px; border:5px solid var(--card-ink); border-radius:40px; padding:20px 16px 18px; display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 8px 0 var(--shadow); animation:pop .3s cubic-bezier(.3,1.6,.5,1); }
.sheet .x{ position:absolute; top:12px; right:12px; }
.ovArt{ display:flex; flex-direction:column; align-items:center; }
.ovArt .emo{ font-size:clamp(60px,14vmin,110px); }
.ovArt .num,.ovArt .letter{ font-size:clamp(60px,14vmin,110px); }
.ovArt .shape,.ovArt .blob{ width:clamp(80px,18vmin,130px); }
.ovArt .stars{ display:none; }
.ovWord{ background:#fff; color:var(--card-ink); border:4px solid var(--card-ink); border-radius:32px; padding:0 24px; font-size:clamp(30px,8vw,48px); font-weight:700; }
.ovVi{ background:#FFF3B0; color:var(--card-ink); border:3px solid var(--card-ink); border-radius:24px; padding:0 18px; font-size:clamp(20px,5vw,28px); font-weight:600; }
.micWrap{ position:relative; width:120px; height:120px; display:flex; align-items:center; justify-content:center; margin:6px 0; }
.micBtn{ width:96px; height:96px; border-radius:50%; background:#fff; border:5px solid var(--card-ink); font-size:44px; z-index:1; padding:0; }
.micRing{ position:absolute; inset:0; border-radius:50%; border:5px solid #fff; opacity:0; }
.overlay.listening .micRing{ animation:ping 1.2s ease-out infinite; }
.overlay.listening .micRing.r2{ animation-delay:.4s; }
.overlay.listening .micBtn{ background:#FF8A7A; animation:pulse2 .5s ease-in-out infinite alternate; }
@keyframes pulse2{ to{ transform:scale(1.1); } }
.bars{ display:flex; gap:6px; height:38px; align-items:flex-end; }
.bars i{ width:10px; height:10px; border-radius:5px; background:#fff; border:3px solid var(--card-ink); }
.overlay.listening .bars i{ animation:eq .5s ease-in-out infinite alternate; }
.bars i:nth-child(2){ animation-delay:.1s; } .bars i:nth-child(3){ animation-delay:.2s; } .bars i:nth-child(4){ animation-delay:.3s; } .bars i:nth-child(5){ animation-delay:.15s; }
@keyframes eq{ to{ height:36px; } }
.msg{ font-size:clamp(24px,6vw,34px); font-weight:700; color:var(--card-ink); text-align:center; min-height:1.3em; }

/* reading pages */
.readwrap{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:2px 2px 10px; }
.sightRow{ display:flex; justify-content:flex-end; }
.sightBox{ border:4px dashed var(--card-ink); background:#fff; color:var(--card-ink); border-radius:14px; padding:0 24px; font-size:clamp(34px,8vw,56px); font-weight:700; line-height:1.25; }
.strip{ display:flex; align-items:center; gap:10px; background:#fff; color:var(--card-ink); border:3px solid var(--card-ink); border-radius:14px; padding:8px 12px; min-height:68px; transition:background .15s, box-shadow .15s; }
.strip.active{ background:#FFF3B0; box-shadow:0 0 0 5px #FFD04D; }
.strip .txt{ flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
.sent{ display:flex; flex-wrap:wrap; gap:0 .5em; font-size:clamp(24px,6vw,40px); font-weight:600; line-height:1.3; }
.w{ padding:0 4px; border-radius:10px; transition:background .12s, transform .12s; }
.w.sw{ font-weight:700; color:#D6336C; }
.w.hl{ background:#FFD04D; transform:scale(1.1); }
.vs{ font-size:clamp(15px,3.8vw,21px); opacity:.75; font-weight:400; }
.no-vi .vs{ display:none; }
.pics{ font-size:clamp(30px,8vw,46px); line-height:1; white-space:nowrap; }
.mini{ width:46px; height:46px; border-radius:50%; border:3px solid var(--card-ink); background:#FFD04D; font-size:20px; flex:none; padding:0; }
.starsRow{ display:flex; justify-content:center; gap:clamp(2px,1.5vw,12px); padding:6px 0 0; }
.starBtn{ font-size:clamp(32px,9vw,54px); line-height:1; background:none; border:none; padding:0 2px; filter:grayscale(1); opacity:.3; }
.starBtn.on{ filter:none; opacity:1; }
.hint{ text-align:center; font-size:clamp(14px,3.5vw,18px); opacity:.8; }
.hint2{ font-size:16px; color:var(--card-ink); text-align:center; }
.pgWrap{ position:relative; }
.pgCard{ width:100%; background:var(--c); border:5px solid var(--card-ink); border-radius:32px; padding:14px 8px; min-height:160px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; }
.pgWord{ font-size:clamp(34px,9vw,54px); font-weight:700; background:#fff; border:4px dashed var(--card-ink); border-radius:14px; padding:0 20px; line-height:1.25; }
.pgStars{ font-size:22px; letter-spacing:1px; color:#2B2350; opacity:.85; }
.pgStars .on{ color:#FFB400; opacity:1; }
.pgPics{ font-size:28px; min-height:1.2em; }
.pgEdit{ position:absolute; top:-8px; right:-8px; }

/* page editor */
.form{ flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:2px 2px 16px; }
.lbl{ display:flex; flex-direction:column; gap:4px; font-weight:600; font-size:clamp(16px,4vw,20px); }
.in{ font-family:inherit; font-size:clamp(18px,4.6vw,24px); border:4px solid var(--card-ink); border-radius:16px; padding:8px 12px; width:100%; background:#fff; color:#2B2350; }
.in.sm{ font-size:clamp(16px,4vw,19px); border-width:3px; padding:6px 10px; }
.erow{ display:flex; gap:8px; align-items:stretch; background:rgba(255,255,255,.55); border:3px solid var(--card-ink); border-radius:18px; padding:8px; }
.picBtn{ width:64px; min-height:64px; border-radius:16px; border:4px solid var(--card-ink); background:#fff; font-size:28px; flex:none; padding:0; }
.efields{ flex:1; display:flex; flex-direction:column; gap:6px; min-width:0; }
.erow .delRow{ align-self:center; }
.qf{ background:rgba(255,255,255,.55); border:3px solid var(--card-ink); border-radius:18px; padding:8px 12px; color:var(--card-ink); }
.qf summary{ font-weight:700; font-size:clamp(18px,4.6vw,24px); cursor:pointer; }
.qf .in{ margin:4px 0; }
.qf .big{ margin-top:6px; max-width:none; width:100%; }
.pkGrid{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; max-height:38vh; overflow:auto; width:100%; }
.pkE{ font-size:28px; background:#fff; border:3px solid var(--card-ink); border-radius:12px; padding:4px 0; }
.pkCur{ font-size:40px; min-height:1.3em; }
.ovLabel{ font-weight:700; color:var(--card-ink); font-size:20px; }
.ovWord.long{ font-size:clamp(24px,6vw,36px); border-radius:24px; text-align:center; display:flex; flex-wrap:wrap; gap:0 .4em; justify-content:center; padding:4px 16px; }

.pronPill{ position:relative; z-index:1; background:#D9F7EE; color:var(--card-ink); border:3px solid var(--card-ink); border-radius:24px; padding:0 18px; font-size:clamp(20px,5vw,30px); font-weight:600; text-align:center; }

/* confetti */
.confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:80; }
.confetti i{ position:absolute; top:-20px; width:14px; height:14px; border-radius:4px; animation:fall 1.7s ease-in forwards; }
@keyframes fall{ to{ transform:translate(var(--dx),110vh) rotate(var(--r)); } }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  .bg{ display:none; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
'use strict';

/* ================= DATA ================= */

/* ================= SOUND SYNTH (Web Audio) ================= */
var ac=null, noiseBuf=null;
function audio(){
  if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(ac && ac.state==='suspended'){ try{ ac.resume(); }catch(e){} }
  return ac;
}
function nbuf(a){
  if(!noiseBuf){
    var len=a.sampleRate*2; noiseBuf=a.createBuffer(1,len,a.sampleRate);
    var d=noiseBuf.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
  }
  return noiseBuf;
}
function env(g,t,dur,vol,atk,rel){
  atk=atk||.02; rel=Math.min(rel||.1,dur*.4);
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+atk);
  g.gain.setValueAtTime(vol,t+Math.max(atk,dur-rel));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
}
function addTrem(a,node,rate,t,dur){
  var tg=a.createGain(); tg.gain.value=.55;
  var tl=a.createOscillator(); tl.frequency.value=rate;
  var tlg=a.createGain(); tlg.gain.value=.45;
  tl.connect(tlg); tlg.connect(tg.gain); node.connect(tg);
  tl.start(t); tl.stop(t+dur+.1);
  return tg;
}
/* tonal voice: o.f = [[time,freq],...] */
function osc(o){
  var a=audio(); if(!a||muted) return;
  var t=a.currentTime+(o.t||0), dur=o.d, f=o.f;
  var s=a.createOscillator(); s.type=o.type||'sawtooth';
  s.frequency.setValueAtTime(f[0][1],t+f[0][0]);
  for(var i=1;i<f.length;i++) s.frequency.exponentialRampToValueAtTime(f[i][1],t+f[i][0]);
  var last=s, g=a.createGain();
  if(o.lp){ var lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=o.lp; last.connect(lp); last=lp; }
  if(o.bp){ var bp=a.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=o.bp; bp.Q.value=o.q||2; last.connect(bp); last=bp; }
  if(o.trem){ last=addTrem(a,last,o.trem,t,dur); }
  if(o.vib){ var vl=a.createOscillator(), vg=a.createGain(); vl.frequency.value=o.vib[0]; vg.gain.value=o.vib[1]; vl.connect(vg); vg.connect(s.frequency); vl.start(t); vl.stop(t+dur+.1); }
  last.connect(g); g.connect(a.destination);
  env(g,t,dur,o.v||.2,o.atk,o.rel);
  s.start(t); s.stop(t+dur+.1);
}
/* noise voice */
function nz(o){
  var a=audio(); if(!a||muted) return;
  var t=a.currentTime+(o.t||0), dur=o.d, f=o.f;
  var s=a.createBufferSource(); s.buffer=nbuf(a); s.loop=true;
  var flt=a.createBiquadFilter(); flt.type=o.type||'bandpass'; flt.Q.value=o.q||1;
  flt.frequency.setValueAtTime(f[0][1],t+f[0][0]);
  for(var i=1;i<f.length;i++) flt.frequency.exponentialRampToValueAtTime(f[i][1],t+f[i][0]);
  var last=flt, g=a.createGain();
  s.connect(flt);
  if(o.trem){ last=addTrem(a,last,o.trem,t,dur); }
  last.connect(g); g.connect(a.destination);
  env(g,t,dur,o.v||.3,o.atk,o.rel);
  s.start(t); s.stop(t+dur+.1);
}

var voice=null, viVoice=null, primed=false;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  var all=speechSynthesis.getVoices();
  var en=all.filter(function(v){ return /^en[-_]/i.test(v.lang); });
  voice=en.find(function(v){ return /samantha|google us english|jenny|aria|zira|karen|ava/i.test(v.name); })
     ||en.find(function(v){ return /en[-_]US/i.test(v.lang); })||en[0]||null;
  viVoice=all.find(function(v){ return /^vi[-_]/i.test(v.lang); })||null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function speak(text,opts){
  opts=opts||{};
  return new Promise(function(res){
    if(muted||!('speechSynthesis' in window)||(opts.vi&&!viVoice)){ setTimeout(res,500); return; }
    try{
      var done=false, fin=function(){ if(!done){ done=true; res(); } };
      var u=new SpeechSynthesisUtterance(text);
      if(opts.vi){ u.lang='vi-VN'; if(viVoice) u.voice=viVoice; }
      else{ u.lang='en-US'; if(voice) u.voice=voice; }
      u.rate=opts.rate||(opts.vi?0.9:0.8);
      u.pitch=opts.pitch||(opts.vi?1.15:1.25);
      u.onend=fin; u.onerror=fin;
      setTimeout(fin,Math.max(2200,text.length*280));
      if(!opts.queue){ speechSynthesis.cancel(); setTimeout(function(){ speechSynthesis.speak(u); },60); }
      else speechSynthesis.speak(u);
    }catch(e){ res(); }
  });
}

/* ================= SPEAKING RECOGNITION ================= */
function lev(a,b){
  var m=[],i,j; for(i=0;i<=a.length;i++) m[i]=[i]; for(j=1;j<=b.length;j++) m[0][j]=j;
  for(i=1;i<=a.length;i++) for(j=1;j<=b.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return m[a.length][b.length];
}
function heardMatch(heard,it){
  var target=it.w.toLowerCase().replace(/[^a-z0-9 ]/g,'');
  var alts=[target]; if(it.n) alts.push(String(it.n));
  for(var h=0;h<heard.length;h++){
    var s=heard[h].toLowerCase().replace(/[^a-z0-9 ]/g,'');
    if(s.indexOf(target)>-1) return true;
    var toks=s.split(/\s+/);
    for(var k=0;k<toks.length;k++) for(var a=0;a<alts.length;a++){
      if(toks[k]===alts[a]) return true;
      if(alts[a].length>=3 && toks[k] && lev(toks[k],alts[a])<=1) return true;
    }
  }
  return false;
}
function listen(ms,lang){
  return new Promise(function(res){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ setTimeout(function(){ res({supported:false,heard:[]}); },ms); return; }
    try{
      var r=new SR(), heard=[], done=false;
      r.lang=(lang==='vi'?'vi-VN':'en-US'); r.interimResults=false; r.maxAlternatives=5;
      var fin=function(sup){ if(done) return; done=true; try{ r.stop(); }catch(e){} res({supported:sup,heard:heard}); };
      r.onresult=function(e){
        for(var i=0;i<e.results.length;i++) for(var j=0;j<e.results[i].length;j++) heard.push(e.results[i][j].transcript);
        fin(true);
      };
      r.onerror=function(e){ fin(!(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'||e.error==='language-not-supported')); };
      r.onend=function(){ fin(true); };
      setTimeout(function(){ fin(true); },ms);
      r.start();
    }catch(e){ setTimeout(function(){ res({supported:false,heard:[]}); },ms); }
  });
}

/* ================= EFFECTS ================= */
function confetti(n){
  n=n||28;
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) n=8;
  var layer=document.createElement('div'); layer.className='confetti';
  var cols=['#FFD84D','#FF6F61','#5BC77B','#5EC8F2','#8E6BE8','#FF8FC7'];
  for(var i=0;i<n;i++){
    var p=document.createElement('i');
    p.style.left=Math.random()*100+'%'; p.style.background=cols[i%cols.length];
    p.style.animationDelay=(Math.random()*.3)+'s';
    p.style.setProperty('--dx',(Math.random()*160-80)+'px');
    p.style.setProperty('--r',(Math.random()*720-360)+'deg');
    layer.appendChild(p);
  }
  document.body.appendChild(layer);
  setTimeout(function(){ layer.remove(); },2300);
}
function burst(el,emojis,n){
  if(!el) return;
  var r=el.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  for(var i=0;i<n;i++){
    var p=document.createElement('span'); p.className='pt'; p.textContent=pick(emojis);
    p.style.left=cx+'px'; p.style.top=cy+'px';
    var ang=Math.random()*Math.PI*2, dist=90+Math.random()*120;
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    p.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    p.style.setProperty('--r',(Math.random()*120-60)+'deg');
    document.body.appendChild(p);
    (function(p){ setTimeout(function(){ p.remove(); },1200); })(p);
  }
}

async function echoPause(id,vn){
  setSoundText(vn?'🎤 Đến lượt con!':'🎤 Your turn!');
  await speak(vn?'Đến lượt con!':'Your turn!',{vi:!!vn});

async function perform(cat,it,id,opt){

  try{

      resetStars();

        var sp=document.querySelectorAll('.stars span')[i]; if(sp) sp.classList.add('pop');
        sfx.ding(i);

      }

    }else if(cat.id==='abc'){
      await speak(SAY[it.l]+'. '+SAY[it.l]+' is for '+it.w+'.'); if(!alive()) return;
      if(opt.echo){ await echoPause(id); if(!alive()) return; }
      sfx.sparkle(); await wait(500); if(!alive()) return;
    }else if(cat.id==='vnabc'){
      await speak(it.n,{vi:true}); if(!alive()) return;
      if(it.s){ await wait(150); await speak(it.s,{vi:true}); if(!alive()) return; }
      await wait(150); await speak(it.w,{vi:true}); if(!alive()) return;
      sfx.sparkle();

    }else{
      await speak(it.w+'!'); if(!alive()) return;
      if(opt.echo){ await echoPause(id); if(!alive()) return; }

      if(it.s) setSoundText(it.s);
      await wait(d*1000+150); if(!alive()) return;

  }
}

function closeOverlay(){ var o=$('#ov'); if(o){ o.remove(); stopAll(); clearActive(); } }
function plain(s){ return String(s).toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim(); }
function vnMatch(heard,it){
  var first=plain(it.w).split(' ')[0], full=plain(it.w), nm=plain(it.n);
  for(var h=0;h<heard.length;h++){
    var s=plain(heard[h]);
    if(s.indexOf(full)>-1||s.indexOf(first)>-1||(nm.length>=2&&s.split(' ').indexOf(nm)>-1)) return true;
    var toks=s.split(' ');
    for(var k=0;k<toks.length;k++) if(first.length>=3&&toks[k]&&lev(toks[k],first)<=1) return true;
  }
  return false;
}

      match:function(h){ return vnMatch(h,it); }, okSay:'Đúng rồi! '+it.w+'! Con giỏi quá!'});

Object.keys(EXTRA).forEach(function(k){ DICT[k]=EXTRA[k]; });
Object.keys(EXTRAVI).forEach(function(k){ VIDICT[k]=EXTRAVI[k]; });
function lookup(map,w){ var k=clean(w).toLowerCase(); return map[k]||map[k.replace(/es$/,'')]||map[k.replace(/s$/,'')]||''; }
function autoPics(t){
  var out=[], seen={};
  wordsOf(t).forEach(function(w){ var e=lookup(DICT,w); if(e && !seen[e]){ seen[e]=1; out.push(e); } });
  return out.slice(0,3).join('');
}
function picCount(s){ return Array.from(s||'').filter(function(c){ return c!=='\uFE0F'; }).length; }
function sentHtml(t,sw){
  return wordsOf(t).map(function(w){ return '<span class="w'+(clean(w).toLowerCase()===sw?' sw':'')+'">'+esc(w)+'</span>'; }).join('');
}
function sentenceMatch(heard,text,sight){
  var tw=text.toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean);
  var sw=(sight||'').toLowerCase();
  for(var h=0;h<heard.length;h++){
    var hw=heard[h].toLowerCase().replace(/[^a-z0-9' ]/g,' ').split(/\s+/).filter(Boolean), hit=0;
    tw.forEach(function(w){ if(hw.some(function(x){ return x===w||(w.length>=4&&lev(x,w)<=1); })) hit++; });
    if(tw.length && hit/tw.length>=.5) return true;
    if(sw && hw.indexOf(sw)>-1 && hit>=2) return true;
  }
  return false;
}

function micOverlay(o){
  stopAll();

  ov.innerHTML='<div class="sheet" style="--c:'+o.color+'">'+

  var advance=function(){ if(o.onNext) state.timer=setTimeout(function(){ if(document.body.contains(ov)) o.onNext(); },2600); };
  var V=o.lang==='vi';
  var T=V?{l:'👂 Nghe nhé…',y:'🎤 Đến lượt con!',ok:'🌟 Đúng rồi!',gt:'🌟 Con nói giỏi quá!',gts:'Con nói giỏi quá!',re:'Thử lại 🎤',res:'Mình chưa nghe rõ. Con nói lại nhé!',tr:'Gần đúng rồi! 💪',trs:'Gần đúng rồi! Con nghe và nói lại nhé.'}
         :{l:'👂 Listen…',y:'🎤 Your turn!',ok:'🌟 Yes!',gt:'🌟 Great talking!',gts:'Great talking! Well done!',re:'Try again 🎤',res:'I could not hear you. Try again!',tr:'Good try! 💪',trs:'Good try! Listen and try again.'};
  var celebrate=function(text,say){ msg(text); sfx.cheer(); confetti(30); addStar(); speak(say,{vi:V}); advance(); };
  async function round(){
    var rid=begin();
    var alive=function(){ return rid===sayId && document.body.contains(ov); };
    ov.classList.remove('listening'); msg(T.l);
    await speak(o.model,{rate:o.rate,vi:V}); if(!alive()) return;
    msg(T.y); ov.classList.add('listening'); sfx.pop();
    await wait(200); if(!alive()) return;
    var r=await listen(o.listenMs||4500,o.lang); if(!alive()) return;
    ov.classList.remove('listening');
    if(!r.supported){ celebrate(T.gt,T.gts); }
    else if(o.match(r.heard)){ celebrate(T.ok,o.okSay); }
    else if(!r.heard.length){ msg(T.re); await speak(T.res,{vi:V}); }
    else{ msg(T.tr); sfx.ding(2); await speak(T.trs,{vi:V}); }
  }
  $('#ovClose').onclick=function(){ sfx.pop(); closeOverlay(); };
  $('#ovAgain').onclick=function(){ sfx.pop(); round(); };
  $('#micBtn').onclick=function(){ sfx.pop(); round(); };
  var nx=$('#ovNext'); if(nx) nx.onclick=function(){ sfx.pop(); o.onNext(); };
  round();
}

    if(star){ var k=parseInt(star.getAttribute('data-star'),10); setStars(pg.stars===k+1?k:k+1); return; }
    var st=e.target.closest('.strip'); if(!st) return;
    var si=parseInt(st.getAttribute('data-i'),10), w=e.target.closest('.w');
    if(w){
      var id=begin(); markActive(si); w.classList.add('hl');
      var words=Array.prototype.slice.call(st.querySelectorAll('.w')), ix=words.indexOf(w);
      speak(clean(pg.sents[si].t.split(/\s+/)[ix])||w.textContent,{rate:.7}).then(function(){ if(id===sayId) clearActive(); });
    }else{
      readSentence(si,begin());
    }
  };
}
async function readSentence(si,id){
  var pg=curPage(); if(!pg) return;
  var s=pg.sents[si], strip=document.querySelectorAll('.strip')[si]; if(!strip) return;
  var wsp=strip.querySelectorAll('.w'); markActive(si);
  /* read the whole sentence twice */
  for(var r=0;r<2;r++){
    if(id!==sayId) return;
    wsp.forEach(function(x){ x.classList.add('hl'); });
    await speak(s.t,{rate:.85}); if(id!==sayId) return;
    wsp.forEach(function(x){ x.classList.remove('hl'); });
    if(r===0) await wait(450);
  }
  if(id!==sayId) return;
  if(viOn && viVoice && s.vi){ await speak(s.vi,{vi:true}); if(id!==sayId) return; }
  if(!state.playing) clearActive();
}
async function listenAll(){
  var pg=curPage(), id=begin(); state.playing=true; drawFoot();
  for(var i=0;i<pg.sents.length;i++){
    if(id!==sayId) return;
    await readSentence(i,id); if(id!==sayId) return;
    await wait(450);
  }
  if(id!==sayId) return;
  state.playing=false; clearActive(); drawFoot(); sfx.sparkle();
}
function sentenceMic(pg,i,seq){
  var s=pg.sents[i], n=pg.sents.length, sw=pg.word.toLowerCase();
  markActive(i);
  micOverlay({
    color:'#B79BFF', label:seq?('Sentence '+(i+1)+' of '+n):'',
    artHtml:'<span class="emo">'+esc(s.pics||'📖')+'</span>', textHtml:sentHtml(s.t,sw), long:true, vi:s.vi,
    model:'Read with me. '+s.t, rate:.78, listenMs:7000,
    match:function(h){ return sentenceMatch(h,s.t,sw); },
    okSay:'Yes! You read it! '+pick(PRAISE),
    onNext:seq?function(){ if(i+1<n) sentenceMic(pg,i+1,true); else { closeOverlay(); if(pg.stars<7) setStars(pg.stars+1); } }:null
  });
}
function setStars(n){
  var pg=curPage(), prev=pg.stars;
  pg.stars=Math.max(0,Math.min(7,n)); savePages();
  document.querySelectorAll('.starBtn').forEach(function(b,k){ b.classList.toggle('on',k<pg.stars); });
  if(pg.stars>prev){
    stopAll(); clearActive();
    bump(document.querySelectorAll('.starBtn')[pg.stars-1]);
    sfx.cheer(); confetti(pg.stars>=7?60:28); addStar();
    speak(pg.stars>=7?'Seven stars! You are a super reader!':pick(PRAISE));
  }
  drawFoot();
}
function roundDone(){
  var pg=curPage();
  if(pg.stars>=7){ pg.stars=0; savePages(); render(); return; }
  setStars(pg.stars+1);
}

function openEdit(id){

  state.edit=p?{id:p.id,word:p.word,rows:JSON.parse(JSON.stringify(p.sents))}:{id:null,word:'',rows:[{t:'',pics:'',vi:''},{t:'',pics:'',vi:''},{t:'',pics:'',vi:''},{t:'',pics:'',vi:''}]};
  state.screen='edit'; render();
}
function rowHtml(r){
  return '<div class="erow" data-pics="'+esc(r.pics||'')+'"><button class="picBtn stk" type="button" data-pic aria-label="Choose picture">'+(r.pics?esc(r.pics):'➕')+'</button>'+
    '<div class="efields"><input class="in sm eS" placeholder="Sentence, e.g. I can see my ball." value="'+esc(r.t)+'" autocapitalize="sentences">'+
    '<input class="in sm eV" placeholder="Tiếng Việt (optional)" value="'+esc(r.vi||'')+'"></div>'+
    '<button class="round sm stk delRow" type="button" aria-label="Remove sentence">✖</button></div>';
}
function setRowPics(r,p){ r.setAttribute('data-pics',p||''); r.querySelector('.picBtn').textContent=p||'➕'; }
function renderEdit(){
  var e=state.edit;
  app.innerHTML=header(e.id?'Edit page':'New page','✏️',true)+
   '<main class="form">'+
    '<label class="lbl">Sight word (the word at the top of the page)<input class="in" id="edWord" value="'+esc(e.word)+'" placeholder="e.g. can" maxlength="20" autocapitalize="none"></label>'+
    '<details class="qf"><summary>✨ Quick fill: make the sentences for me</summary>'+
      '<input class="in sm" id="qfA" value="I can see my ___." aria-label="First sentence pattern">'+
      '<input class="in sm" id="qfAv" value="Con thấy ___ của con." aria-label="First pattern in Vietnamese">'+
      '<input class="in sm" id="qfB" value="I like my ___." aria-label="Second sentence pattern">'+
      '<input class="in sm" id="qfBv" value="Con thích ___ của con." aria-label="Second pattern in Vietnamese">'+
      '<input class="in sm" id="qfN" placeholder="Words, separated by commas: ball, duck, blocks" aria-label="Words">'+
      '<input class="in sm" id="qfL" placeholder="Last sentence (optional): I like my toys!" aria-label="Last sentence">'+
      '<button class="big stk" type="button" id="qfMake">✨ Make sentences</button></details>'+
    '<div id="rows">'+e.rows.map(rowHtml).join('')+'</div>'+
    '<button class="big sky stk" type="button" id="addRow" style="max-width:none">➕ Add sentence</button>'+
    '<div class="hint">Tip: press Enter to start the next sentence. Pictures are chosen for you. Tap a picture to change it.</div>'+
   '</main>'+
   '<footer class="foot"><button class="big stk" id="saveBtn">💾 Save</button><button class="big alt stk" id="cancelBtn">Cancel</button>'+
   (e.id?'<button class="big stk" id="delBtn" style="background:#FF6F61">🗑 Delete</button>':'')+'</footer>';
  var rows=$('#rows');
  var addRow=function(after){
    var d=document.createElement('div'); d.innerHTML=rowHtml({t:'',pics:'',vi:''}); var node=d.firstChild;
    if(after) after.after(node); else rows.appendChild(node);
    return node;
  };
  rows.addEventListener('click',function(ev){
    var pb=ev.target.closest('[data-pic]'); if(pb){ openPicker(pb.closest('.erow')); return; }
    var db=ev.target.closest('.delRow');
    if(db){
      var all=rows.querySelectorAll('.erow'), r=db.closest('.erow');
      if(all.length>1) r.remove();
      else{ r.querySelector('.eS').value=''; r.querySelector('.eV').value=''; setRowPics(r,''); }
    }
  });
  rows.addEventListener('keydown',function(ev){
    if(ev.key==='Enter' && ev.target.tagName==='INPUT'){
      ev.preventDefault();
      var nr=addRow(ev.target.closest('.erow')); nr.querySelector('.eS').focus();
    }
  });
  rows.addEventListener('focusout',function(ev){
    if(!ev.target.classList || !ev.target.classList.contains('eS')) return;
    var r=ev.target.closest('.erow'), v=ev.target.value.trim();
    if(v && !r.getAttribute('data-pics') && !r.getAttribute('data-cleared')) setRowPics(r,autoPics(v));
    var vi=r.querySelector('.eV');
    if(v && !vi.value.trim()){
      /* nothing to translate offline; the parent can type it */
    }
  });
  $('#addRow').onclick=function(){ sfx.pop(); var nr=addRow(null); nr.querySelector('.eS').focus(); };
  $('#qfMake').onclick=function(){
    var A=$('#qfA').value.trim(), B=$('#qfB').value.trim(), Av=$('#qfAv').value.trim(), Bv=$('#qfBv').value.trim(), L=$('#qfL').value.trim();
    var nouns=$('#qfN').value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    if(!nouns.length){ toast('Type some words first, like: dog, cat, fish'); return; }
    var list=[], allP=[];
    nouns.forEach(function(n){
      var p=autoPics(n), v=lookup(VIDICT,n); if(p) allP.push(p);
      if(A) list.push({t:A.replace('___',n),pics:p,vi:(Av&&v)?Av.replace('___',v):''});
      if(B) list.push({t:B.replace('___',n),pics:'',vi:(Bv&&v)?Bv.replace('___',v):''});
    });
    if(L) list.push({t:L,pics:allP.slice(0,3).join(''),vi:''});
    rows.innerHTML=list.map(rowHtml).join('');
    toast('Made '+list.length+' sentences. You can change anything.');
  };
  $('#saveBtn').onclick=saveEdit;
  $('#cancelBtn').onclick=function(){ sfx.pop(); state.screen='pages'; render(); };
  var del=$('#delBtn');
  if(del) del.onclick=function(){
    if(del.getAttribute('data-sure')){
      pages=pages.filter(function(p){ return p.id!==e.id; }); savePages(); sfx.boop();
      state.screen='pages'; render(); return;
    }
    del.setAttribute('data-sure','1'); del.textContent='Tap again to delete';
    setTimeout(function(){ if(document.body.contains(del)){ del.removeAttribute('data-sure'); del.textContent='🗑 Delete'; } },3000);
  };
}
function saveEdit(){
  var w=$('#edWord').value.trim().toLowerCase();
  var rows=Array.prototype.slice.call(document.querySelectorAll('.erow')).map(function(r){
    return {t:r.querySelector('.eS').value.trim(),pics:r.getAttribute('data-pics')||'',vi:r.querySelector('.eV').value.trim()};
  }).filter(function(x){ return x.t; });
  if(!w){ toast('Please type the sight word at the top.'); return; }
  if(!rows.length){ toast('Add at least one sentence.'); return; }
  var e=state.edit;
  if(e.id){ var p=pages.find(function(x){ return x.id===e.id; }); p.word=w; p.sents=rows; }
  else pages.push({id:'p'+Date.now(),word:w,stars:0,sents:rows});
  savePages(); sfx.cheer(); toast('Saved ✓');
  state.screen='pages'; render();
}
function openPicker(row){
  var old=$('#pk'); if(old) old.remove();
  var pk=document.createElement('div'); pk.className='overlay'; pk.id='pk';
  pk.innerHTML='<div class="sheet" style="--c:#FFF3B0"><button class="round sm stk x" id="pkClose" aria-label="Close">✖</button>'+
    '<div class="msg">Pick up to 3 pictures</div><div class="pkCur" id="pkCur"></div>'+
    '<div class="pkGrid">'+PICKS.map(function(x){ return '<button class="pkE" type="button" data-e="'+x+'">'+x+'</button>'; }).join('')+'</div>'+
    '<div class="foot"><button class="big alt stk" id="pkClear">Clear</button><button class="big mint stk" id="pkDone">Done</button></div></div>';
  document.body.appendChild(pk);
  var cur=row.getAttribute('data-pics')||'';
  var show=function(){ $('#pkCur').textContent=cur||'—'; };
  show();
  pk.querySelector('.pkGrid').onclick=function(ev){
    var b=ev.target.closest('[data-e]'); if(!b) return;
    if(picCount(cur)>=3){ toast('Up to 3 pictures. Tap Clear to start again.'); return; }
    cur+=b.getAttribute('data-e'); sfx.pop(); show();
  };
  $('#pkClear').onclick=function(){ cur=''; row.setAttribute('data-cleared','1'); show(); };
  var done=function(){ setRowPics(row,cur); if(cur) row.removeAttribute('data-cleared'); pk.remove(); };
  $('#pkDone').onclick=function(){ sfx.pop(); done(); };
  $('#pkClose').onclick=function(){ pk.remove(); };
}
function openBackup(){
  var old=$('#bk'); if(old) old.remove();
  var m=document.createElement('div'); m.className='overlay'; m.id='bk';
  m.innerHTML='<div class="sheet" style="--c:#C9F0FF"><button class="round sm stk x" id="bkClose" aria-label="Close">✖</button>'+
    '<div class="msg">Backup and move pages</div>'+
    '<div class="hint2">Pages are saved on this device. Copy this text to keep a backup, or paste text from another device and tap Load.</div>'+
    '<textarea id="bkText" class="in sm" rows="7" spellcheck="false"></textarea>'+
    '<div class="foot"><button class="big stk" id="bkCopy">📋 Copy</button><button class="big mint stk" id="bkLoad">📥 Load</button></div></div>';
  document.body.appendChild(m);
  var ta=$('#bkText'); ta.value=JSON.stringify(pages);
  $('#bkClose').onclick=function(){ m.remove(); };
  $('#bkCopy').onclick=function(){
    sfx.pop(); ta.focus(); ta.select();
    var ok=false;
    try{ ok=document.execCommand('copy'); }catch(e){}
    if(!ok && navigator.clipboard){ try{ navigator.clipboard.writeText(ta.value); ok=true; }catch(e){} }
    toast(ok?'Copied ✓':'Select the text and copy it by hand.');
  };
  $('#bkLoad').onclick=function(){
    try{
      var data=JSON.parse(ta.value), added=0;
      if(!Array.isArray(data)) throw new Error('bad');
      data.forEach(function(p){
        if(p && typeof p.word==='string' && Array.isArray(p.sents) && !pages.some(function(x){ return x.id===p.id; })){
          pages.push({id:String(p.id||('p'+Date.now()+added)),word:p.word,stars:Math.min(7,Math.max(0,parseInt(p.stars,10)||0)),
            sents:p.sents.filter(function(s){ return s && typeof s.t==='string'; }).map(function(s){ return {t:s.t,pics:s.pics||'',vi:s.vi||''}; })});
          added++;
        }
      });
      savePages(); m.remove(); toast(added?('Added '+added+' page(s) ✓'):'Nothing new to add.'); render();
    }catch(e){ toast('That text is not a valid backup.'); }
  };
}

/* ================= GO ================= */
makeBg();
render();
})();
</script>
